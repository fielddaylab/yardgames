name: Publish to Vault CDN

# Builds The Yard with `make build` and publishes it as one game, `yardgames`, with a folder per game:
#   https://builds.vaultlearninggames.org/fieldday/yardgames/<branch>/<game>/   (e.g. .../master/wind/)
# Runs on a push to any branch or by hand (Actions → Publish to Vault CDN → Run workflow).
# Deleting a branch removes its preview. Production releases are made from the Vault portal.
on:
  push:
  delete:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    if: github.event_name != 'delete'
    runs-on: ubuntu-latest
    outputs:
      artifact: yardgames-${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Build
        run: make build
      - uses: actions/upload-artifact@v7
        with:
          name: yardgames-${{ github.sha }}
          path: dist
          retention-days: 3

  preview:
    needs: build
    uses: VaultLearningGames/vault-publisher/.github/workflows/publish-preview.yml@v1
    with:
      game: yardgames
      artifact: ${{ needs.build.outputs.artifact }}

  remove-preview:
    if: github.event_name == 'delete'
    uses: VaultLearningGames/vault-publisher/.github/workflows/publish-preview.yml@v1
    with:
      game: yardgames
